<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>o_p_g + tools</title>
    <script>
      // Sets the theme before the first paint. The same rule as resolveTheme in src/core/theme.js.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('glyph-editor:theme')
        } catch (error) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/taz7zox.css">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <glyph-app></glyph-app>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
